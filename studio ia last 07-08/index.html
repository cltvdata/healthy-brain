<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HEALTHY + BRAIN: Bio-Tracking & Longevity Coach</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Healthy+Brain" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'space-obsidian': '#0a0a0a',
              'glass-noir': 'rgba(25, 25, 25, 0.75)',
              'bio-orange': '#ff8a00',
              'neuro-blue': '#00d1ff',
              'bio-green': '#13ec5b',
            },
            fontFamily: {
              sans: ['Outfit', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
      
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Scan animation */
      @keyframes scan {
        0% { top: 0%; opacity: 0.8; }
        50% { top: 100%; opacity: 0.8; }
        100% { top: 0%; opacity: 0.8; }
      }
      .animate-scan {
        animation: scan 3s infinite linear;
      }

      /* Breathing animation */
      @keyframes breathe {
        0% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 20px rgba(0, 209, 255, 0.2); }
        45% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 50px rgba(0, 209, 255, 0.6); }
        55% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 50px rgba(0, 209, 255, 0.6); }
        100% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 20px rgba(0, 209, 255, 0.2); }
      }
      .animate-breathe {
        animation: breathe 16s infinite ease-in-out;
      }

      /* Subtle grid noise background */
      .bg-bio-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      }
    </style>
  </head>
  <body class="bg-space-obsidian bg-bio-grid min-h-screen">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

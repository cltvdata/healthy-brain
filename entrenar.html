<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Entrenar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/design-system.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-image:
                radial-gradient(circle at 50% 10%, rgba(255, 138, 0, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Eliminar flechas de number inputs */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 shadow-2xl border-x border-white/5">

        <!-- Header -->
        <header class="flex items-center justify-between p-6 pb-4 border-b border-white/5 bg-dark/80 backdrop-blur-xl sticky top-0 z-40">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white mb-1">GIMNASIO <span
                        class="text-neon">PREMIUM</span></h1>
                <p class="text-[10px] font-black text-text-gray uppercase tracking-widest" id="current-date"></p>
            </div>
            <a href="perfil-setup.html"
                class="h-10 w-10 overflow-hidden rounded-xl border border-white/10 bg-surface-glass backdrop-blur-md flex items-center justify-center hover:border-primary transition-all shadow-lg shrink-0">
                <span class="material-symbols-outlined text-text-gray text-[20px]">person</span>
            </a>
        </header>

        <main class="flex-1 px-4 py-4 overflow-y-auto no-scrollbar" id="workout-container">
            <!-- Los ejercicios dinámicos se insertarán aquí -->
        </main>

        <div class="px-6 pb-8 mt-4 flex flex-col gap-4">
            <button onclick="addExercise()"
                class="w-full h-14 rounded-2xl bg-surface-glass border border-dashed border-white/10 text-text-gray font-bold uppercase tracking-widest flex items-center justify-center gap-2 hover:bg-white/5 hover:border-neon transition-all">
                <span class="material-symbols-outlined text-[20px]">add</span> Añadir Ejercicio
            </button>
            <button onclick="saveWorkout()"
                class="glow-btn w-full h-16 rounded-2xl bg-neon text-dark font-black text-lg uppercase tracking-widest shadow-[0_0_20px_rgba(255,138,0,0.3)] hover:scale-[1.02] active:scale-95 transition-all">
                Finalizar Sesión
            </button>
        </div>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/5 bg-dark/90 backdrop-blur-2xl pb-safe pt-4 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-4 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Lobby</span>
                </a>
                <a href="entrenar.html" class="flex flex-col items-center gap-1 text-neon w-1/5">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">fitness_center</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Gimnasio</span>
                </a>
                <a href="historial.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">analytics</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Progreso</span>
                </a>
                <a href="descanso.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">timer</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Descanso</span>
                </a>
                <a href="ejercicios.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">library_books</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Biblioteca</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Application Logic -->
    <script>
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', dateOptions).replace(/^\w/, (c) => c.toUpperCase());

        let exercises = [];

        function init() {
            const saved = localStorage.getItem('hb_current_workout');
            if (saved) {
                exercises = JSON.parse(saved);
            }

            if (exercises.length === 0) {
                addExercise();
            } else {
                renderAll();
            }
        }

        function addExercise() {
            exercises.push({
                id: Date.now(),
                name: '',
                sets: [{ id: Date.now() + 1, reps: '', weight: '' }]
            });
            renderAll();
            saveState();
        }

        function removeExercise(exId) {
            exercises = exercises.filter(e => e.id !== exId);
            renderAll();
            saveState();
        }

        function addSet(exId) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex > -1) {
                exercises[exIndex].sets.push({ id: Date.now(), reps: '', weight: '' });
                renderAll();
                saveState();
            }
        }

        function removeSet(exId, setId) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex > -1) {
                exercises[exIndex].sets = exercises[exIndex].sets.filter(s => s.id !== setId);
                renderAll();
                saveState();
            }
        }

        function updateData(exId, type, val, setId = null) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex === -1) return;

            if (type === 'name') {
                exercises[exIndex].name = val;
            } else if (setId) {
                const setIndex = exercises[exIndex].sets.findIndex(s => s.id === setId);
                if (setIndex > -1) {
                    exercises[exIndex].sets[setIndex][type] = val;
                }
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem('hb_current_workout', JSON.stringify(exercises));
        }

        function saveWorkout() {
            const validExercises = exercises.filter(ex => ex.name.trim() !== "" && ex.sets.some(s => s.reps !== "" || s.weight !== ""));

            if (validExercises.length === 0) {
                alert("Añade al menos un ejercicio con nombre y datos para guardar.");
                return;
            }

            if (!confirm("¿Has terminado tu entrenamiento? Se guardará en el historial.")) return;

            const history = JSON.parse(localStorage.getItem('hb_workout_history') || '[]');
            const newSession = {
                timestamp: Date.now(),
                exercises: validExercises,
                type: "Fuerza",
                duration: "45 min"
            };

            history.push(newSession);
            localStorage.setItem('hb_workout_history', JSON.stringify(history));

            alert('¡Enhorabuena! Sesión registrada con éxito.');

            exercises = [];
            localStorage.removeItem('hb_current_workout');
            window.location.href = "historial.html";
        }

        function renderAll() {
            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            exercises.forEach((ex, index) => {
                const exDiv = document.createElement('div');
                exDiv.className = 'glass-card p-6 mb-6 relative border-white/5 bg-white/2';

                let deleteExBtn = '';
                if (exercises.length > 1) {
                    deleteExBtn = `<button onclick="removeExercise(${ex.id})" class="absolute top-6 right-6 text-text-gray hover:text-red-400 transition-colors"><span class="material-symbols-outlined text-[20px]">delete_sweep</span></button>`;
                }

                let setsHtml = '';
                ex.sets.forEach((set, sIndex) => {
                    setsHtml += `
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-neon/10 border border-neon/20 flex items-center justify-center text-xs text-neon font-black shrink-0">
                                ${sIndex + 1}
                            </div>
                            <div class="flex-1 glass-card border-white/5 rounded-xl flex items-center px-4 h-12 bg-black/20">
                                <span class="text-[10px] font-black text-text-gray mr-3 uppercase tracking-tighter shrink-0">kg</span>
                                <input type="number" 
                                    class="bg-transparent w-full high-contrast-input h-8 px-2 rounded-lg text-white text-sm font-black outline-none" 
                                    placeholder="0" value="${set.weight}" 
                                    onchange="updateData(${ex.id}, 'weight', this.value, ${set.id})">
                                <span class="material-symbols-outlined text-neon/30 text-sm ml-2">monitor_weight</span>
                            </div>
                            <div class="flex-1 glass-card border-white/5 rounded-xl flex items-center px-4 h-12 bg-black/20">
                                <span class="text-[10px] font-black text-text-gray mr-3 uppercase tracking-tighter shrink-0">reps</span>
                                <input type="number" 
                                    class="bg-transparent w-full high-contrast-input h-8 px-2 rounded-lg text-white text-sm font-black outline-none" 
                                    placeholder="0" value="${set.reps}"
                                    onchange="updateData(${ex.id}, 'reps', this.value, ${set.id})">
                                <span class="material-symbols-outlined text-neon/30 text-sm ml-2">rebase_edit</span>
                            </div>
                            <button onclick="removeSet(${ex.id}, ${set.id})" class="w-12 h-12 rounded-xl bg-red-500/10 border border-red-500/20 text-red-500 hover:bg-red-500/20 flex items-center justify-center shrink-0 transition-all">
                                <span class="material-symbols-outlined text-[18px]">remove</span>
                            </button>
                        </div>
                    `;
                });

                exDiv.innerHTML = `
                    ${deleteExBtn}
                    <div class="mb-6 pr-10">
                        <p class="text-[10px] font-black text-neon uppercase tracking-[0.2em] mb-2">Ejercicio ACTIVO</p>
                        <input type="text" class="w-full h-12 px-4 rounded-xl high-contrast-input text-xl font-black outline-none border-b border-white/5 transition-all uppercase tracking-tight" placeholder="Nombre (ej. PRESS BANCA)" value="${ex.name}" onchange="updateData(${ex.id}, 'name', this.value)">
                    </div>
                    
                    <div class="flex flex-col mb-4">
                        <div class="flex items-center gap-3 px-2 mb-3">
                            <div class="w-10 text-center text-[10px] text-text-gray font-black uppercase tracking-widest">Set</div>
                            <div class="flex-1 text-[10px] text-text-gray font-black uppercase tracking-widest pl-4">Carga</div>
                            <div class="flex-1 text-[10px] text-text-gray font-black uppercase tracking-widest pl-4">Volumen</div>
                            <div class="w-12"></div>
                        </div>
                        ${setsHtml}
                    </div>

                    <button onclick="addSet(${ex.id})" class="w-full py-3 rounded-xl bg-white/5 border border-white/10 text-neon text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[14px] font-black">add</span> Nueva Serie
                    </button>
                `;
                container.appendChild(exDiv);
            });
        }

        function applyUserBg() {
            const bg = localStorage.getItem('hb_user_bg') || 'tech';
            const bgOverlay = document.createElement('div');
            bgOverlay.id = 'dynamic-bg';
            bgOverlay.className = 'fixed inset-0 pointer-events-none z-[-1] opacity-[0.08] transition-opacity duration-1000';
            bgOverlay.style.backgroundImage = `url('assets/images/bg_${bg}.png')`;
            bgOverlay.style.backgroundSize = 'cover';
            bgOverlay.style.backgroundPosition = 'center';
            document.body.appendChild(bgOverlay);
        }

        init();
        applyUserBg();
    </script>
</body>

</html>

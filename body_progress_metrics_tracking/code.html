<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Body Progress &amp; Metrics Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#D97706", // Matte Orange
                        "background-light": "#FDF8F5", // Creamy Light
                        "background-dark": "#1A0F0A",  // Deep Dark Chocolate
                        olive: "#708238",
                        concrete: "#95A5A6",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "16px",
                    },
                },
            },
        };
    </script>
<style>
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }::-webkit-scrollbar {
            width: 0px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans min-h-screen">
<div class="h-12 w-full bg-transparent"></div>
<header class="px-6 flex items-center justify-between mb-8">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-200/50 dark:bg-white/10">
<span class="material-symbols-rounded">chevron_left</span>
</button>
<h1 class="text-xl font-semibold font-display tracking-tight">Body Progress</h1>
<button class="text-primary font-medium px-4 py-1">Save</button>
</header>
<main class="px-6 pb-20 space-y-10">
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-sm font-bold uppercase tracking-widest text-concrete">Metrics Entry</h2>
<div class="flex items-center gap-2 bg-slate-200/50 dark:bg-white/5 px-3 py-1.5 rounded-full text-sm">
<span class="material-symbols-rounded text-base">calendar_today</span>
<span>Oct 24, 2023</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-white dark:bg-white/5 p-4 rounded-2xl border border-slate-200 dark:border-white/10">
<label class="block text-xs text-concrete mb-1">Weight (kg)</label>
<input class="w-full bg-transparent border-none p-0 text-2xl font-semibold focus:ring-0 placeholder:text-slate-300 dark:placeholder:text-white/20" placeholder="00.0" type="number"/>
</div>
<div class="bg-white dark:bg-white/5 p-4 rounded-2xl border border-slate-200 dark:border-white/10">
<label class="block text-xs text-concrete mb-1">Waist (cm)</label>
<input class="w-full bg-transparent border-none p-0 text-2xl font-semibold focus:ring-0 placeholder:text-slate-300 dark:placeholder:text-white/20" placeholder="00" type="number"/>
</div>
<div class="bg-white dark:bg-white/5 p-4 rounded-2xl border border-slate-200 dark:border-white/10">
<label class="block text-xs text-concrete mb-1">Chest (cm)</label>
<input class="w-full bg-transparent border-none p-0 text-2xl font-semibold focus:ring-0 placeholder:text-slate-300 dark:placeholder:text-white/20" placeholder="00" type="number"/>
</div>
<div class="bg-white dark:bg-white/5 p-4 rounded-2xl border border-slate-200 dark:border-white/10">
<label class="block text-xs text-concrete mb-1">Hip (cm)</label>
<input class="w-full bg-transparent border-none p-0 text-2xl font-semibold focus:ring-0 placeholder:text-slate-300 dark:placeholder:text-white/20" placeholder="00" type="number"/>
</div>
</div>
</section>
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-sm font-bold uppercase tracking-widest text-concrete">Evolution</h2>
<div class="flex gap-2">
<button class="text-xs px-3 py-1 rounded-full bg-primary text-white">Weight</button>
<button class="text-xs px-3 py-1 rounded-full bg-slate-200 dark:bg-white/10 text-concrete">Metrics</button>
</div>
</div>
<div class="bg-white dark:bg-white/5 p-6 rounded-3xl border border-slate-200 dark:border-white/10 relative overflow-hidden">
<div class="flex items-baseline gap-1 mb-8">
<span class="text-3xl font-bold">74.2</span>
<span class="text-sm text-olive">-1.5 kg this month</span>
</div>
<div class="relative h-40 w-full mt-4">
<div class="absolute inset-0 flex flex-col justify-between opacity-20">
<div class="border-t border-concrete w-full"></div>
<div class="border-t border-concrete w-full"></div>
<div class="border-t border-concrete w-full"></div>
<div class="border-t border-concrete w-full"></div>
</div>
<svg class="absolute inset-0 h-full w-full overflow-visible" preserveAspectRatio="none">
<path d="M0 80 Q 50 70, 100 100 T 200 60 T 300 90 T 400 40" fill="none" stroke="#708238" stroke-linecap="round" stroke-width="3"></path>
<circle cx="0" cy="80" fill="#708238" r="4"></circle>
<circle cx="100" cy="100" fill="#708238" r="4"></circle>
<circle cx="200" cy="60" fill="#708238" r="4"></circle>
<circle cx="300" cy="90" fill="#708238" r="4"></circle>
<circle cx="400" cy="40" fill="#708238" r="4"></circle>
</svg>
<div class="absolute -bottom-6 w-full flex justify-between text-[10px] text-concrete uppercase tracking-tighter">
<span>Sep 28</span>
<span>Oct 05</span>
<span>Oct 12</span>
<span>Oct 19</span>
<span>Today</span>
</div>
</div>
</div>
</section>
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-sm font-bold uppercase tracking-widest text-concrete">Progress Photos</h2>
<span class="text-xs text-primary font-medium">View History</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="aspect-[3/4] rounded-2xl bg-primary flex flex-col items-center justify-center gap-2 text-white shadow-lg active:scale-95 transition-transform">
<div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-symbols-rounded text-3xl">add</span>
</div>
<span class="text-sm font-medium">Add Photo</span>
</button>
<div class="relative aspect-[3/4] rounded-2xl overflow-hidden group">
<img alt="Body progress side view" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAl7qlo-W40P08JjvEYGf3LaBeAH-quVAzmUtoqRjQI6I5h6N5uM5o6aWZzwXzTbCvrqZodJ6qEC-XuBDx8MY3mptbByUVMkLcgvwcrp1mVLqvNGnLnFR-lDwX7zZvwMPyOZPR2W0KD5jgUX0vPyNwf5A4wq-Xgta3k5BLQlAKDkkm4nPsvM5hKP9ZkMaDlg7fHFMM7T8cw9aIvHJ-F-mXJTDUvf_eyxRNABtUEUpn_CDC9MHv6W8aL-jUKtOH80JlejLY_9mOiMH4"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<div class="absolute bottom-3 left-3">
<p class="text-[10px] text-white/70 uppercase">Front View</p>
<p class="text-xs text-white font-medium">Oct 14, 2023</p>
</div>
</div>
<div class="relative aspect-[3/4] rounded-2xl overflow-hidden group">
<img alt="Gym progress photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBsCwY3KYxmyIx-bX8zNmhmxnYOsd3oxbyX6XZeFlB0PJDuXr0snxCW6V1fJvLTuUo60RJML6z7ASulbfwgORrnVkW5rCpOzCXsGnem_yl5KsYvaHXIJ1Mvt6z6C4g8aOet6cWQFrSZwGsc2iMRDjHmZer5yx1SNrW44eaqRIp4xU0O9ZqB9Gd1jfJa-jOLZwsgehMSWK2IyO7_tzhSNYX8QgX-wnsg7ce5GkT198jd41VIbeSeKP-WK4vAdN-UpnNBX-qO_PIMizw"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<div class="absolute bottom-3 left-3">
<p class="text-[10px] text-white/70 uppercase">Side View</p>
<p class="text-xs text-white font-medium">Oct 01, 2023</p>
</div>
</div>
<div class="relative aspect-[3/4] rounded-2xl overflow-hidden bg-slate-200 dark:bg-white/5 border border-dashed border-concrete/30 flex items-center justify-center">
<span class="material-symbols-rounded text-concrete opacity-20 text-4xl">photo_camera</span>
</div>
</div>
</section>
</main>
<div class="fixed bottom-8 left-0 right-0 px-6 pointer-events-none">
<button class="pointer-events-auto w-full py-4 bg-primary text-white font-semibold rounded-2xl shadow-2xl shadow-primary/30 active:scale-[0.98] transition-all">
            Generate Comparison
        </button>
</div>
<div class="fixed bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-900/10 dark:bg-white/10 rounded-full"></div>

</body></html>

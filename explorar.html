<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Healthy + Brain - Explorar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#13ec5b',
                        'primary-dark': '#0dbd47',
                        'background-dark': '#102216',
                        'surface-dark': '#1a3324',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateX(10px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-background-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 animate-fade-in shadow-2xl bg-background-dark border-x border-white/5">

        <!-- Header -->
        <header class="flex items-center justify-between p-6 pb-2">
            <div class="flex items-center gap-2">
                <h1 class="text-2xl font-bold tracking-tight text-white">Explorar</h1>
            </div>
            <div class="flex gap-3">
                <button
                    class="w-10 h-10 rounded-full bg-surface-dark border border-white/10 flex items-center justify-center text-white hover:bg-white/10 transition-colors">
                    <span class="material-symbols-outlined text-[20px]">search</span>
                </button>
            </div>
        </header>

        <main class="flex-1 px-6 py-4 overflow-y-auto no-scrollbar">

            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-4 -mx-6 px-6 mb-2">
                <button
                    class="px-5 py-2 rounded-full bg-primary text-background-dark font-bold text-sm whitespace-nowrap">Todas</button>
                <button
                    class="px-5 py-2 rounded-full bg-surface-dark border border-white/10 text-gray-300 font-medium text-sm whitespace-nowrap hover:bg-white/5 disabled:opacity-50">Enfoque</button>
                <button
                    class="px-5 py-2 rounded-full bg-surface-dark border border-white/10 text-gray-300 font-medium text-sm whitespace-nowrap hover:bg-white/5 disabled:opacity-50">Descanso</button>
                <button
                    class="px-5 py-2 rounded-full bg-surface-dark border border-white/10 text-gray-300 font-medium text-sm whitespace-nowrap hover:bg-white/5 disabled:opacity-50">Rutina</button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Session 1 -->
                <a href="sesion-detalle.html"
                    class="block group cursor-pointer bg-surface-dark rounded-2xl overflow-hidden border border-white/5 hover:border-primary/50 transition-colors relative">
                    <div class="h-32 bg-black relative overflow-hidden">
                        <img src="assets/images/session_focus.png" alt="Bio-Assisted Focus"
                            class="w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span
                                class="material-symbols-outlined text-white/50 text-3xl group-hover:text-primary transition-colors">play_circle</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3
                            class="font-bold text-sm text-white mb-1 leading-tight group-hover:text-primary transition-colors">
                            Bio-Assisted Focus</h3>
                        <p class="text-[10px] text-gray-400">45 min • Productividad</p>
                    </div>
                </a>

                <!-- Session 2 -->
                <a href="sesion-detalle.html"
                    class="block group cursor-pointer bg-surface-dark rounded-2xl overflow-hidden border border-white/5 hover:border-primary/50 transition-colors relative">
                    <div class="h-32 bg-black relative overflow-hidden">
                        <img src="assets/images/session_circadian.png" alt="Circadian Planner"
                            class="w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span
                                class="material-symbols-outlined text-white/50 text-3xl group-hover:text-primary transition-colors">play_circle</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3
                            class="font-bold text-sm text-white mb-1 leading-tight group-hover:text-primary transition-colors">
                            Circadian Planner</h3>
                        <p class="text-[10px] text-gray-400">15 min • Hábito Diario</p>
                    </div>
                </a>

                <!-- Session 3 -->
                <a href="sesion-detalle.html"
                    class="block group cursor-pointer bg-surface-dark rounded-2xl overflow-hidden border border-white/5 hover:border-primary/50 transition-colors relative">
                    <div class="h-32 bg-black relative overflow-hidden">
                        <img src="assets/images/session_dopamine.png" alt="Dopamine Regulation"
                            class="w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span
                                class="material-symbols-outlined text-white/50 text-3xl group-hover:text-primary transition-colors">play_circle</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3
                            class="font-bold text-sm text-white mb-1 leading-tight group-hover:text-primary transition-colors">
                            Dopamine Regulation</h3>
                        <p class="text-[10px] text-gray-400">30 min • Bienestar Mental</p>
                    </div>
                </a>

                <!-- Session 4 -->
                <a href="sesion-detalle.html"
                    class="block group cursor-pointer bg-surface-dark rounded-2xl overflow-hidden border border-white/5 hover:border-primary/50 transition-colors relative">
                    <div class="h-32 bg-black relative overflow-hidden">
                        <img src="assets/images/session_sleep.png" alt="Sleep Recovery"
                            class="w-full h-full object-cover opacity-70 group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span
                                class="material-symbols-outlined text-white/50 text-3xl group-hover:text-primary transition-colors">play_circle</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h3
                            class="font-bold text-sm text-white mb-1 leading-tight group-hover:text-primary transition-colors">
                            Sleep Recovery</h3>
                        <p class="text-[10px] text-gray-400">60 min • Recuperación</p>
                    </div>
                </a>
            </div>

        </main>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/10 bg-background-dark/95 backdrop-blur-md pb-safe pt-3 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-4 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-medium">Inicio</span>
                </a>
                <a href="explorar.html" class="flex flex-col items-center gap-1 text-primary">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">explore</span>
                    <span class="text-[10px] font-medium">Explorar</span>
                </a>
                <a href="perfil.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors">
                    <span class="material-symbols-outlined">person</span>
                    <span class="text-[10px] font-medium">Perfil</span>
                </a>
            </div>
        </nav>
    </div>
</body>

</html>

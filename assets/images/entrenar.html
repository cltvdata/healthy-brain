<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Entrenar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#13ec5b',
                        'primary-dark': '#0dbd47',
                        'background-dark': '#102216',
                        'surface-dark': '#1a3324',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Eliminar flechas de number inputs */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body class="bg-background-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 animate-fade-in shadow-2xl bg-background-dark border-x border-white/5">

        <!-- Header -->
        <header
            class="flex flex-col p-6 pb-4 border-b border-white/5 bg-background-dark/90 backdrop-blur-md sticky top-0 z-40">
            <h1 class="text-2xl font-bold tracking-tight text-white mb-1">Entrenamiento</h1>
            <p class="text-sm text-gray-400" id="current-date"></p>
        </header>

        <main class="flex-1 px-4 py-4 overflow-y-auto no-scrollbar" id="workout-container">
            <!-- Los ejercicios dinámicos se insertarán aquí -->
        </main>

        <div class="px-4 pb-6 mt-4 flex flex-col gap-3">
            <button onclick="addExercise()"
                class="w-full h-12 rounded-xl bg-surface-dark border border-dashed border-white/20 text-gray-300 font-medium flex items-center justify-center gap-2 hover:bg-white/5 hover:border-primary/50 transition-colors">
                <span class="material-symbols-outlined text-[18px]">add</span> Añadir Ejercicio
            </button>
            <button onclick="saveWorkout()"
                class="w-full h-14 rounded-2xl bg-primary text-background-dark font-bold text-lg shadow-[0_0_20px_rgba(19,236,91,0.3)] hover:scale-105 active:scale-95 transition-all">
                Finalizar y Guardar
            </button>
        </div>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/10 bg-background-dark/95 backdrop-blur-md pb-safe pt-3 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-1 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-medium scale-90">Inicio</span>
                </a>
                <a href="entrenar.html" class="flex flex-col items-center gap-1 text-primary w-1/5">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">fitness_center</span>
                    <span class="text-[10px] font-medium scale-90">Entrenar</span>
                </a>
                <a href="historial.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">history</span>
                    <span class="text-[10px] font-medium scale-90">Historial</span>
                </a>
                <a href="descanso.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">timer</span>
                    <span class="text-[10px] font-medium scale-90">Descanso</span>
                </a>
                <a href="ejercicios.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">library_books</span>
                    <span class="text-[10px] font-medium scale-90">Ejercicios</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Application Logic -->
    <script>
        // Formatear Fecha
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', dateOptions).replace(/^\w/, (c) => c.toUpperCase());

        let exercises = [];

        // Inicializador
        function init() {
            const saved = localStorage.getItem('hb_current_workout');
            if (saved) {
                exercises = JSON.parse(saved);
            }
            if (exercises.length === 0) {
                addExercise(); // Start with at least one empty exercise
            } else {
                renderAll();
            }
        }

        // Agregar Ejercicio
        function addExercise() {
            exercises.push({
                id: Date.now(),
                name: '',
                sets: [{ id: Date.now() + 1, reps: '', weight: '' }]
            });
            renderAll();
            saveState();
        }

        // Eliminar Ejercicio
        function removeExercise(exId) {
            exercises = exercises.filter(e => e.id !== exId);
            renderAll();
            saveState();
        }

        // Agregar Variante (Set)
        function addSet(exId) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex > -1) {
                exercises[exIndex].sets.push({ id: Date.now(), reps: '', weight: '' });
                renderAll();
                saveState();
            }
        }

        // Eliminar Serie
        function removeSet(exId, setId) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex > -1) {
                exercises[exIndex].sets = exercises[exIndex].sets.filter(s => s.id !== setId);
                renderAll();
                saveState();
            }
        }

        // Actualizar datos
        function updateData(exId, type, val, setId = null) {
            const exIndex = exercises.findIndex(e => e.id === exId);
            if (exIndex === -1) return;

            if (type === 'name') {
                exercises[exIndex].name = val;
            } else if (setId) {
                const setIndex = exercises[exIndex].sets.findIndex(s => s.id === setId);
                if (setIndex > -1) {
                    exercises[exIndex].sets[setIndex][type] = val;
                }
            }
            saveState();
        }

        // Guardar progreso temporal en LocalStorage
        function saveState() {
            localStorage.setItem('hb_current_workout', JSON.stringify(exercises));
            console.log('Autoguardado', exercises);
        }

        // Guardar entrenamiento final
        function saveWorkout() {
            if (exercises.length === 0 || (exercises.length === 1 && !exercises[0].name)) {
                alert("Añade al menos un ejercicio con nombre para guardar.");
                return;
            }

            const history = JSON.parse(localStorage.getItem('hb_workout_history') || '[]');
            const newSession = {
                timestamp: Date.now(),
                exercises: exercises.filter(ex => ex.name.trim() !== ""),
                type: "Fuerza"
            };

            history.push(newSession);
            localStorage.setItem('hb_workout_history', JSON.stringify(history));

            alert('¡Enhorabuena! Tu entrenamiento ha sido registrado en tu historial.');
            exercises = [];
            localStorage.removeItem('hb_current_workout');
            addExercise();
        }

        // Renderizar la UI
        function renderAll() {
            const container = document.getElementById('workout-container');
            container.innerHTML = '';

            exercises.forEach((ex, index) => {
                const exDiv = document.createElement('div');
                exDiv.className = 'bg-surface-dark rounded-3xl p-4 border border-white/5 mb-4 animate-slide-up relative';

                // Botón eliminar ejercicio (solo si hay más de 1)
                let deleteExBtn = '';
                if (exercises.length > 1) {
                    deleteExBtn = `<button onclick="removeExercise(${ex.id})" class="absolute top-4 right-4 text-gray-500 hover:text-red-400 transition-colors"><span class="material-symbols-outlined text-[18px]">close</span></button>`;
                }

                // Generar filas de series
                let setsHtml = '';
                ex.sets.forEach((set, sIndex) => {
                    setsHtml += `
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 rounded-lg bg-black/40 border border-white/5 flex items-center justify-center text-xs text-gray-400 font-bold shrink-0">
                                ${sIndex + 1}
                            </div>
                            <div class="flex-1 bg-black/40 border border-white/5 rounded-xl flex items-center px-3 h-10">
                                <span class="text-xs text-gray-500 mr-2">kg</span>
                                <input type="number" 
                                    class="bg-transparent w-full text-white text-sm font-semibold outline-none" 
                                    placeholder="0" value="${set.weight}" 
                                    onchange="updateData(${ex.id}, 'weight', this.value, ${set.id})">
                            </div>
                            <div class="flex-1 bg-black/40 border border-white/5 rounded-xl flex items-center px-3 h-10">
                                <span class="text-xs text-gray-500 mr-2">reps</span>
                                <input type="number" 
                                    class="bg-transparent w-full text-white text-sm font-semibold outline-none" 
                                    placeholder="0" value="${set.reps}"
                                    onchange="updateData(${ex.id}, 'reps', this.value, ${set.id})">
                            </div>
                            <button onclick="removeSet(${ex.id}, ${set.id})" class="w-10 h-10 rounded-xl border border-red-500/20 text-red-500/70 hover:bg-red-500/10 hover:text-red-500 flex items-center justify-center shrink-0 transition-all">
                                <span class="material-symbols-outlined text-[16px]">remove</span>
                            </button>
                        </div>
                    `;
                });

                exDiv.innerHTML = `
                    ${deleteExBtn}
                    <div class="mb-4 pr-8">
                        <input type="text" class="w-full bg-transparent text-lg font-bold text-white outline-none placeholder-gray-500 border-b border-transparent focus:border-primary/50 transition-colors pb-1" placeholder="Nombre del Ejercicio (ej. Press Banca)" value="${ex.name}" onchange="updateData(${ex.id}, 'name', this.value)">
                    </div>
                    
                    <div class="flex flex-col mb-3">
                        <div class="flex items-center gap-2 px-1 mb-2">
                            <div class="w-8 text-center text-[10px] text-gray-500 font-bold uppercase tracking-wider">Set</div>
                            <div class="flex-1 text-[10px] text-gray-500 font-bold uppercase tracking-wider pl-2">Peso</div>
                            <div class="flex-1 text-[10px] text-gray-500 font-bold uppercase tracking-wider pl-2">Reps</div>
                            <div class="w-10"></div>
                        </div>
                        ${setsHtml}
                    </div>

                    <button onclick="addSet(${ex.id})" class="w-full py-2 rounded-lg bg-white/5 text-primary text-xs font-bold hover:bg-white/10 transition-colors flex items-center justify-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">add</span> Añadir Serie
                    </button>
                `;
                container.appendChild(exDiv);
            });
        }

        // Inicializar al cargar
        init();
    </script>
</body>

</html>

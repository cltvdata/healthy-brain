<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Descanso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#13ec5b',
                        'primary-dark': '#0dbd47',
                        'background-dark': '#102216',
                        'surface-dark': '#1a3324',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '.5' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .timer-text {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body class="bg-background-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 animate-fade-in shadow-2xl bg-background-dark border-x border-white/5">

        <!-- Header -->
        <header
            class="flex flex-col items-center justify-center p-6 border-b border-white/5 bg-background-dark/90 backdrop-blur-md sticky top-0 z-40">
            <h1 class="text-2xl font-bold tracking-tight text-white mb-1">Recuperación</h1>
            <p class="text-xs text-gray-400">Temporizador de Descanso</p>
        </header>

        <main class="flex-1 px-6 py-8 flex flex-col items-center justify-center no-scrollbar">

            <!-- Circular Progress & Timer -->
            <div class="relative w-64 h-64 mb-10 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90 absolute top-0 left-0" viewBox="0 0 100 100">
                    <!-- Base ring -->
                    <circle cx="50" cy="50" r="45" fill="none" class="stroke-surface-dark" stroke-width="6"></circle>
                    <!-- Progress ring -->
                    <circle id="progress-ring" cx="50" cy="50" r="45" fill="none" class="stroke-primary"
                        stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round"
                        style="transition: stroke-dashoffset 1s linear;"></circle>
                </svg>
                <div class="flex flex-col items-center justify-center relative z-10">
                    <span id="timer-display"
                        class="timer-text text-6xl font-extrabold text-white tracking-tighter">01:00</span>
                    <span id="timer-status"
                        class="text-sm font-medium text-primary mt-1 uppercase tracking-widest">Listo</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-6 mb-10">
                <!-- Add 30s -->
                <button onclick="addTime(30)"
                    class="w-14 h-14 rounded-full bg-surface-dark border border-white/10 text-white font-bold flex items-center justify-center hover:bg-white/5 transition-colors shadow-sm">
                    +30s
                </button>

                <!-- Play / Pause -->
                <button id="play-btn" onclick="toggleTimer()"
                    class="w-20 h-20 rounded-full bg-primary text-background-dark flex items-center justify-center shadow-[0_0_20px_rgba(19,236,91,0.3)] hover:scale-105 active:scale-95 transition-all">
                    <span id="play-icon" class="material-symbols-outlined text-[40px]">play_arrow</span>
                </button>

                <!-- Add 1m -->
                <button onclick="addTime(60)"
                    class="w-14 h-14 rounded-full bg-surface-dark border border-white/10 text-white font-bold flex items-center justify-center hover:bg-white/5 transition-colors shadow-sm">
                    +1m
                </button>
            </div>

            <!-- Presets Grid -->
            <div class="w-full">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest">Ajustes Rápidos</h3>
                    <button onclick="resetTimer()"
                        class="text-xs text-red-400 font-medium hover:text-red-300 transition-colors flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">history</span> Reiniciar
                    </button>
                </div>

                <div class="grid grid-cols-5 gap-2">
                    <button onclick="setTimer(30)"
                        class="py-3 rounded-xl bg-surface-dark border border-white/5 text-gray-300 font-medium text-xs hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-colors">30s</button>
                    <button onclick="setTimer(60)"
                        class="py-3 rounded-xl bg-surface-dark border border-white/5 text-gray-300 font-medium text-xs hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-colors">60s</button>
                    <button onclick="setTimer(90)"
                        class="py-3 rounded-xl bg-surface-dark border border-white/5 text-gray-300 font-medium text-xs hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-colors">90s</button>
                    <button onclick="setTimer(120)"
                        class="py-3 rounded-xl bg-surface-dark border border-white/5 text-gray-300 font-medium text-xs hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-colors">2m</button>
                    <button onclick="setTimer(180)"
                        class="py-3 rounded-xl bg-surface-dark border border-white/5 text-gray-300 font-medium text-xs hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-colors">3m</button>
                </div>
            </div>

            <!-- Custom Time & Breathing -->
            <div class="w-full flex gap-3 mt-4">
                <button onclick="setCustomTime()"
                    class="flex-1 py-3 rounded-xl bg-black/20 text-gray-400 font-medium text-xs flex items-center justify-center gap-2 hover:bg-white/5 transition-colors border border-dashed border-white/10">
                    <span class="material-symbols-outlined text-[16px]">edit</span> Personalizado
                </button>
                <button onclick="openBreathMode()"
                    class="flex-1 py-3 rounded-xl bg-primary/10 text-primary font-bold text-xs flex items-center justify-center gap-2 hover:bg-primary/20 transition-colors border border-primary/20">
                    <span class="material-symbols-outlined text-[16px]">lungs</span> Respiración
                </button>
            </div>

        </main>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/10 bg-background-dark/95 backdrop-blur-md pb-safe pt-3 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-2 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-medium scale-90">Inicio</span>
                </a>
                <a href="entrenar.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">fitness_center</span>
                    <span class="text-[10px] font-medium scale-90">Entrenar</span>
                </a>
                <a href="historial.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">history</span>
                    <span class="text-[10px] font-medium scale-90">Historial</span>
                </a>
                <a href="descanso.html" class="flex flex-col items-center gap-1 text-primary w-1/5">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">timer</span>
                    <span class="text-[10px] font-medium scale-90">Descanso</span>
                </a>
                <a href="ejercicios.html"
                    class="flex flex-col items-center gap-1 text-gray-500 hover:text-white transition-colors w-1/5">
                    <span class="material-symbols-outlined">library_books</span>
                    <span class="text-[10px] font-medium scale-90">Ejercicios</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Breathing Mode Overlay -->
    <div id="breath-overlay"
        class="fixed inset-0 bg-background-dark z-[60] hidden flex-col items-center justify-center p-10 animate-fade-in">
        <button onclick="closeBreathMode()" class="absolute top-8 right-8 text-gray-500 hover:text-white"><span
                class="material-symbols-outlined text-[32px]">close</span></button>

        <div id="breath-circle"
            class="w-48 h-48 rounded-full bg-primary/20 border-2 border-primary flex items-center justify-center relative shadow-[0_0_50px_rgba(19,236,91,0.2)] transition-all ease-in-out">
            <span id="breath-label" class="text-xl font-bold text-primary uppercase tracking-widest">Inhala</span>
        </div>

        <div class="mt-16 text-center">
            <h2 class="text-2xl font-bold mb-2">Respiración Consciente</h2>
            <p class="text-gray-400 text-sm max-w-xs">Enfócate en el círculo para sincronizar tu ritmo y calmar tu
                cerebro.</p>
            <div id="breath-seconds" class="mt-4 text-4xl font-mono text-white opacity-50 tracking-tighter">4.0</div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        let initialTime = 60; // default 60s
        let timeRemaining = 60;
        let timerInterval = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const playIcon = document.getElementById('play-icon');
        const playBtn = document.getElementById('play-btn');
        const progressRing = document.getElementById('progress-ring');

        // El circulo de SVG tiene un dasharray de 2*pi*r = 2 * Math.PI * 45 = ~282.74
        const circumference = 2 * Math.PI * 45;

        function updateDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // Actualizar anillo
            const proportion = timeRemaining / initialTime;
            // Cuando proportion es 1, dashoffset es 0 (circulo completo).
            // Cuando proportion es 0, dashoffset es circumference.
            const offset = circumference - (proportion * circumference);
            progressRing.style.strokeDashoffset = offset || 0;

            // Colores según tiempo
            if (timeRemaining === 0) {
                progressRing.classList.replace('stroke-primary', 'stroke-red-500');
                timerDisplay.classList.add('text-red-500');
            } else {
                progressRing.classList.replace('stroke-red-500', 'stroke-primary');
                timerDisplay.classList.remove('text-red-500');
            }
        }

        function setTimer(seconds) {
            initialTime = seconds;
            timeRemaining = seconds;
            localStorage.setItem('hb_last_rest', seconds);
            if (isRunning) {
                pauseTimer();
            }
            updateDisplay();
            timerStatus.textContent = "Listo";
            timerStatus.classList.remove('animate-pulse-glow');
        }

        function toggleTimer() {
            if (timeRemaining === 0) {
                // If it finished, toggle resets to initial
                resetTimer();
                return;
            }

            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timeRemaining > 0) {
                isRunning = true;
                playIcon.textContent = 'pause';
                playBtn.classList.remove('bg-primary');
                playBtn.classList.add('bg-white');
                timerStatus.textContent = "Activo";
                timerStatus.classList.add('animate-pulse-glow');

                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateDisplay();

                    if (timeRemaining <= 0) {
                        finishTimer();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            playIcon.textContent = 'play_arrow';
            playBtn.classList.remove('bg-white');
            playBtn.classList.add('bg-primary');
            timerStatus.textContent = "Pausado";
            timerStatus.classList.remove('animate-pulse-glow');
        }

        function resetTimer() {
            pauseTimer();
            timeRemaining = initialTime;
            updateDisplay();
            timerStatus.textContent = "Listo";
        }

        function addTime(seconds) {
            timeRemaining += seconds;
            if (timeRemaining > initialTime) {
                initialTime = timeRemaining; // Expand ring capacity dynamically
            }
            updateDisplay();
            // If it was at zero and we add time, let them resume it manually
            if (timeRemaining > 0 && playIcon.textContent === 'restart_alt') {
                playIcon.textContent = 'play_arrow';
                playBtn.classList.remove('bg-red-500');
                playBtn.classList.add('bg-primary');
            }
        }

        function finishTimer() {
            pauseTimer();
            timerStatus.textContent = "¡Tiempo!";
            playIcon.textContent = 'restart_alt';
            playBtn.classList.remove('bg-white', 'bg-primary');
            playBtn.classList.add('bg-red-500');

            // Vibración si está disponible (mobile only)
            if ("vibrate" in navigator) {
                navigator.vibrate([200, 100, 200, 100, 500]);
            }
        }

        function setCustomTime() {
            const input = prompt("Introduce los minutos para el descanso (ej. 1.5):", "1");
            if (input !== null) {
                const num = parseFloat(input);
                if (!isNaN(num) && num > 0) {
                    setTimer(Math.round(num * 60));
                }
            }
        }

        // --- Logica de Respiración ---
        let breathInterval = null;
        let breathTimer = null;

        function openBreathMode() {
            document.getElementById('breath-overlay').classList.remove('hidden');
            document.getElementById('breath-overlay').classList.add('flex');
            startBreathCycle();
        }

        function closeBreathMode() {
            document.getElementById('breath-overlay').classList.add('hidden');
            document.getElementById('breath-overlay').classList.remove('flex');
            clearInterval(breathInterval);
            clearTimeout(breathTimer);
            // Reset circle size
            const circle = document.getElementById('breath-circle');
            circle.style.transform = 'scale(1)';
        }

        function startBreathCycle() {
            const circle = document.getElementById('breath-circle');
            const label = document.getElementById('breath-label');
            const secondsText = document.getElementById('breath-seconds');

            let phase = 0; // 0: inhale, 1: hold, 2: exhale, 3: hold
            const phases = [
                { name: 'Inhala', time: 4, scale: 1.5, duration: 4000 },
                { name: 'Retén', time: 1.5, scale: 1.5, duration: 1500 },
                { name: 'Exhala', time: 8, scale: 1, duration: 8000 },
                { name: 'Retén', time: 1.5, scale: 1, duration: 1500 }
            ];

            function nextPhase() {
                const p = phases[phase];
                label.innerText = p.name;
                circle.style.transitionDuration = `${p.duration}ms`;
                circle.style.transform = `scale(${p.scale})`;

                let remaining = p.time;

                // Update text every 100ms
                if (breathInterval) clearInterval(breathInterval);
                breathInterval = setInterval(() => {
                    remaining -= 0.1;
                    secondsText.innerText = Math.max(0, remaining).toFixed(1);
                    if (remaining <= 0) {
                        clearInterval(breathInterval);
                    }
                }, 100);

                // Wait for the full duration of the phase
                if (breathTimer) clearTimeout(breathTimer);
                breathTimer = setTimeout(() => {
                    phase = (phase + 1) % phases.length;
                    nextPhase();
                }, p.duration);
            }

            nextPhase();
        }

        // Initialize display
        updateDisplay();
    </script>
</body>

</html>

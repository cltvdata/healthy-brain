<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0a0a0a"/>
  <g transform="translate(100,100)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,20; 0,0" dur="2s" repeatCount="indefinite"/>
    <circle cx="0" cy="30" r="15" fill="#ff8a00"/>
    <rect x="-8" y="-10" width="16" height="40" rx="5" fill="#ff8a00"/>
    <rect x="-12" y="-25" width="24" height="20" rx="3" fill="#ff8a00"/>
    <circle cx="0" cy="-35" r="12" fill="#ff8a00"/>
    <line x1="-12" y1="0" x2="-25" y2="30" stroke="#ff8a00" stroke-width="4" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="25" y2="30" stroke="#ff8a00" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="100" y="185" text-anchor="middle" fill="#ff8a00" font-family="Outfit" font-size="11">SQUAT</text>
  <text x="100" y="195" text-anchor="middle" fill="#666" font-family="Outfit" font-size="9">3x12 repeticiones</text>
</svg>
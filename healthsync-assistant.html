<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN — HealthSync Assistant</title>
    <meta name="description" content="Asistente IA de salud multimodal con análisis biométrico en tiempo real">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/design-system.css">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        /* ── Chat Layout ────────────────────────── */
        .chat-shell {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 28rem;
            margin: 0 auto;
            background: var(--bg-dark);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem 6rem;
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .chat-messages::-webkit-scrollbar { display: none; }

        /* ── Message Bubbles ─────────────────────── */
        .msg-user {
            margin-left: auto;
            max-width: 85%;
            background: linear-gradient(135deg, rgba(255,138,0,0.15), rgba(255,138,0,0.05));
            border: 1px solid rgba(255,138,0,0.2);
            border-radius: 20px 20px 4px 20px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            animation: msgIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .msg-ai {
            margin-right: auto;
            max-width: 92%;
            background: var(--surface-glass);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px 20px 20px 4px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            animation: msgIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .msg-ai .glass-card {
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.08);
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Typing Indicator ────────────────────── */
        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 0.5rem 0;
        }
        .typing-dots span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--primary-orange);
            animation: typingBounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* ── Input Bar ───────────────────────────── */
        .input-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 28rem;
            padding: 0.75rem 1rem 2rem;
            background: linear-gradient(to top, var(--bg-dark) 60%, transparent);
            z-index: 50;
        }

        .input-bar-inner {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 0.5rem 0.5rem 0.5rem 1rem;
            transition: border-color 0.3s;
        }
        .input-bar-inner:focus-within {
            border-color: rgba(255,138,0,0.4);
            box-shadow: 0 0 20px rgba(255,138,0,0.08);
        }

        .input-bar-inner textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 0.875rem;
            resize: none;
            max-height: 80px;
            line-height: 1.4;
        }
        .input-bar-inner textarea::placeholder {
            color: rgba(255,255,255,0.35);
        }

        .input-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .input-btn:active { transform: scale(0.9); }

        .btn-action {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-action.active { background: rgba(255,138,0,0.2); color: var(--primary-orange); }

        .btn-send {
            background: var(--primary-orange);
            color: black;
            box-shadow: 0 0 16px rgba(255,138,0,0.3);
        }
        .btn-send:hover { box-shadow: 0 0 24px rgba(255,138,0,0.5); }
        .btn-send:disabled { opacity: 0.4; box-shadow: none; cursor: default; }

        /* ── Camera Overlay ──────────────────────── */
        .camera-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: var(--bg-dark);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .camera-overlay.open { display: flex; }

        .camera-overlay video {
            width: 100%;
            max-width: 28rem;
            max-height: 60vh;
            border-radius: 24px;
            object-fit: cover;
            border: 2px solid rgba(255,138,0,0.2);
        }

        /* ── Image Preview in Bubble ─────────────── */
        .msg-image {
            max-width: 100%;
            border-radius: 16px;
            margin-bottom: 0.5rem;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ── Mic Recording Pulse ─────────────────── */
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,138,0,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,138,0,0); }
        }
        .mic-recording {
            animation: micPulse 1.5s infinite;
            background: rgba(255,138,0,0.25) !important;
            color: var(--primary-orange) !important;
        }

        /* ── Welcome Card ────────────────────────── */
        .welcome-card {
            text-align: center;
            padding: 3rem 2rem;
        }
        .welcome-icon-ring {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,138,0,0.15), rgba(0,209,255,0.1));
            border: 1px solid rgba(255,138,0,0.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 40px rgba(255,138,0,0.1);
        }

        /* ── Markdown rendering inside AI bubbles ── */
        .msg-ai p { margin-bottom: 0.5rem; }
        .msg-ai strong { color: var(--primary-orange); }
        .msg-ai ul, .msg-ai ol { padding-left: 1.2rem; margin-bottom: 0.5rem; }
        .msg-ai li { margin-bottom: 0.25rem; }
        .msg-ai code {
            background: rgba(255,255,255,0.06);
            padding: 0.1rem 0.35rem;
            border-radius: 4px;
            font-size: 0.8em;
        }
    </style>
</head>

<body class="bg-dark text-white">

    <div class="chat-shell" id="chatShell">

        <!-- ── Header ─────────────────────────── -->
        <header
            class="flex items-center gap-3 px-5 py-4 border-b border-white/5 bg-dark/80 backdrop-blur-xl z-30 shrink-0">
            <a href="index.html"
                class="w-9 h-9 rounded-full bg-surface-dark border border-white/10 flex items-center justify-center text-white hover:bg-white/10 transition-colors shrink-0">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
            </a>
            <div class="flex-1 min-w-0">
                <h1 class="text-sm font-extrabold tracking-tight truncate">HealthSync <span
                        class="text-primary">Assistant</span></h1>
                <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                    <span class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">NeuroVital 2026 •
                        Gemini</span>
                </div>
            </div>
            <button onclick="clearChat()"
                class="w-9 h-9 rounded-full bg-surface-dark border border-white/10 flex items-center justify-center text-gray-500 hover:text-red-400 hover:border-red-500/30 transition-colors"
                title="Limpiar conversación">
                <span class="material-symbols-outlined text-[18px]">delete_sweep</span>
            </button>
        </header>

        <!-- ── Messages Area ──────────────────── -->
        <div class="chat-messages" id="chatMessages">

            <!-- Welcome -->
            <div class="welcome-card" id="welcomeCard">
                <div class="welcome-icon-ring">
                    <span class="material-symbols-outlined text-primary text-[36px]"
                        style="font-variation-settings: 'FILL' 1;">neurology</span>
                </div>
                <h2 class="text-lg font-bold mb-2">Bienvenido al Asistente <span class="text-primary">HealthSync</span>
                </h2>
                <p class="text-xs text-gray-400 leading-relaxed mb-6 max-w-[280px] mx-auto">
                    Tu arquitecto de longevidad personal. Envía texto, fotos de comida, o usa el micrófono para análisis
                    biométrico instantáneo.
                </p>
                <div class="flex flex-wrap justify-center gap-2">
                    <button onclick="sendQuickPrompt('Evalúa mi preparación biológica hoy')"
                        class="px-3 py-1.5 rounded-xl bg-surface-dark border border-white/10 text-[11px] font-bold text-gray-300 hover:border-primary/40 hover:text-primary transition-all">
                        🧬 Bio-Readiness
                    </button>
                    <button onclick="sendQuickPrompt('Dame un protocolo de recuperación post-entrenamiento')"
                        class="px-3 py-1.5 rounded-xl bg-surface-dark border border-white/10 text-[11px] font-bold text-gray-300 hover:border-primary/40 hover:text-primary transition-all">
                        💪 Recuperación
                    </button>
                    <button onclick="sendQuickPrompt('Analiza mis macros del día y sugiere mejoras')"
                        class="px-3 py-1.5 rounded-xl bg-surface-dark border border-white/10 text-[11px] font-bold text-gray-300 hover:border-primary/40 hover:text-primary transition-all">
                        🥗 Macro Check
                    </button>
                    <button onclick="sendQuickPrompt('Optimiza mi rutina de sueño para máxima regeneración')"
                        class="px-3 py-1.5 rounded-xl bg-surface-dark border border-white/10 text-[11px] font-bold text-gray-300 hover:border-primary/40 hover:text-primary transition-all">
                        🌙 Protocolo Sueño
                    </button>
                </div>
            </div>

        </div>

        <!-- ── Input Bar ──────────────────────── -->
        <div class="input-bar">
            <div class="input-bar-inner">
                <button class="input-btn btn-action" id="btnCamera" onclick="openCamera()" title="Cámara">
                    <span class="material-symbols-outlined text-[20px]">photo_camera</span>
                </button>
                <button class="input-btn btn-action" id="btnMic" onclick="toggleMic()" title="Micrófono">
                    <span class="material-symbols-outlined text-[20px]">mic</span>
                </button>
                <textarea id="chatInput" rows="1" placeholder="Pregunta algo a tu asistente..."
                    oninput="autoGrow(this)" onkeydown="handleKey(event)"></textarea>
                <button class="input-btn btn-send" id="btnSend" onclick="sendFromInput()" disabled>
                    <span class="material-symbols-outlined text-[20px]"
                        style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ── Camera Overlay ─────────────────── -->
    <div class="camera-overlay" id="cameraOverlay">
        <div class="w-full max-w-md px-5 flex flex-col items-center gap-5">
            <div class="flex items-center justify-between w-full mb-2">
                <button onclick="closeCamera()"
                    class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <span
                    class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-1.5">
                    <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span> Cámara Activa
                </span>
                <div class="w-10"></div>
            </div>
            <video id="cameraVideo" autoplay playsinline muted></video>
            <button onclick="captureAndSend()"
                class="w-16 h-16 rounded-full bg-primary flex items-center justify-center text-black shadow-[0_0_30px_rgba(255,138,0,0.4)] active:scale-90 transition-transform">
                <span class="material-symbols-outlined text-[28px]"
                    style="font-variation-settings: 'FILL' 1;">photo_camera</span>
            </button>
            <p class="text-[11px] text-gray-500 text-center">Apunta a tu comida, suplemento o reporte de salud</p>
        </div>
    </div>

    <!-- ── Scripts ────────────────────────── -->
    <script src="js/healthsync-chat.js"></script>
    <script>
        // ── DOM refs ────────────────────────
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');
        const btnMic = document.getElementById('btnMic');
        const welcomeCard = document.getElementById('welcomeCard');
        const cameraOverlay = document.getElementById('cameraOverlay');
        const cameraVideo = document.getElementById('cameraVideo');

        let pendingImageBase64 = null;
        let isRecording = false;

        // ── Init ────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            await HealthSyncChat.init();
            restoreMessages();
            chatInput.addEventListener('input', updateSendBtn);
            updateSendBtn();
        });

        // ── Restore persisted messages ──────
        function restoreMessages() {
            const history = HealthSyncChat.conversationHistory;
            if (history.length === 0) return;
            welcomeCard.style.display = 'none';

            for (const msg of history) {
                if (msg.role === 'user') {
                    let text = '';
                    let imgData = null;
                    for (const p of msg.parts) {
                        if (p.text) text = p.text;
                        if (p.inlineData) imgData = p.inlineData.data;
                    }
                    appendUserBubble(text, imgData, false);
                } else if (msg.role === 'model') {
                    let text = '';
                    let fc = null;
                    for (const p of msg.parts) {
                        if (p.text) text += p.text;
                        if (p.functionCall) fc = p.functionCall;
                    }
                    appendAIBubble(text, fc, false);
                }
            }
            scrollToBottom();
        }

        // ── Send from text input ────────────
        async function sendFromInput() {
            const text = chatInput.value.trim();
            if (!text && !pendingImageBase64) return;
            chatInput.value = '';
            chatInput.style.height = 'auto';
            updateSendBtn();
            await sendChat(text, pendingImageBase64);
            pendingImageBase64 = null;
        }

        async function sendQuickPrompt(text) {
            await sendChat(text);
        }

        async function sendChat(text, imageBase64 = null) {
            welcomeCard.style.display = 'none';
            appendUserBubble(text, imageBase64);
            showTyping();
            scrollToBottom();

            const response = await HealthSyncChat.sendMessage(text, imageBase64);
            removeTyping();

            if (response) {
                appendAIBubble(response.text, response.functionCall);
            }
            scrollToBottom();
        }

        // ── Bubble Rendering ────────────────
        function appendUserBubble(text, imageBase64 = null, animate = true) {
            const div = document.createElement('div');
            div.className = 'msg-user';
            if (!animate) div.style.animation = 'none';

            let html = '';
            if (imageBase64) {
                html += `<img src="data:image/jpeg;base64,${imageBase64}" class="msg-image" alt="Foto enviada">`;
            }
            if (text) {
                html += `<p class="text-sm text-white/90">${escapeHtml(text)}</p>`;
            }
            div.innerHTML = html;
            chatMessages.appendChild(div);
        }

        function appendAIBubble(text, functionCall = null, animate = true) {
            const div = document.createElement('div');
            div.className = 'msg-ai';
            if (!animate) div.style.animation = 'none';

            let html = '';

            // Render function call cards first (structured data)
            if (functionCall) {
                html += HealthSyncChat.renderFunctionCall(functionCall);
            }

            // Render text (simple markdown)
            if (text) {
                html += `<div class="text-sm text-gray-300 leading-relaxed">${renderMarkdown(text)}</div>`;
            }

            div.innerHTML = html;
            chatMessages.appendChild(div);
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg-ai';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Analizando</span>
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>`;
            chatMessages.appendChild(div);
        }

        function removeTyping() {
            document.getElementById('typingIndicator')?.remove();
        }

        // ── Camera ──────────────────────────
        async function openCamera() {
            cameraOverlay.classList.add('open');
            const ok = await HealthSyncChat.startCamera(cameraVideo);
            if (!ok) {
                alert('No se pudo acceder a la cámara. Verifica los permisos.');
                closeCamera();
            }
        }

        function closeCamera() {
            HealthSyncChat.stopCamera();
            cameraOverlay.classList.remove('open');
        }

        async function captureAndSend() {
            const base64 = HealthSyncChat.captureFrame(cameraVideo);
            closeCamera();
            await sendChat('Analiza esta imagen y evalúa su impacto biológico', base64);
        }

        // ── Microphone ──────────────────────
        async function toggleMic() {
            if (isRecording) {
                HealthSyncChat.stopListening();
                btnMic.classList.remove('mic-recording');
                isRecording = false;
                return;
            }

            isRecording = true;
            btnMic.classList.add('mic-recording');

            try {
                const transcript = await HealthSyncChat.startListening();
                btnMic.classList.remove('mic-recording');
                isRecording = false;
                if (transcript) {
                    await sendChat(transcript);
                }
            } catch (err) {
                btnMic.classList.remove('mic-recording');
                isRecording = false;
                console.warn('Mic error:', err);
            }
        }

        // ── Utilities ───────────────────────
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendFromInput();
            }
        }

        function autoGrow(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        function updateSendBtn() {
            btnSend.disabled = !chatInput.value.trim() && !pendingImageBase64;
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            });
        }

        function clearChat() {
            if (!confirm('¿Limpiar toda la conversación?')) return;
            HealthSyncChat.clearHistory();
            chatMessages.innerHTML = '';
            welcomeCard.style.display = '';
            chatMessages.appendChild(welcomeCard);
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function renderMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`(.+?)`/g, '<code>$1</code>')
                .replace(/^### (.+)$/gm, '<h4 class="text-xs font-bold text-white mt-3 mb-1">$1</h4>')
                .replace(/^## (.+)$/gm, '<h3 class="text-sm font-bold text-white mt-3 mb-1">$1</h3>')
                .replace(/^# (.+)$/gm, '<h2 class="text-base font-bold text-white mt-3 mb-1">$1</h2>')
                .replace(/^- (.+)$/gm, '<li class="ml-3">$1</li>')
                .replace(/\n/g, '<br>');
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>HEALTHY + BRAIN: Bio-Tracking & Longevity Coach</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'space-obsidian': '#0a0a0a',
              'glass-noir': 'rgba(25, 25, 25, 0.75)',
              'bio-orange': '#ff8a00',
              'neuro-blue': '#00d1ff',
              'bio-green': '#13ec5b',
            },
            fontFamily: {
              sans: ['Outfit', 'Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
      
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #0a0a0a;
        color: #ffffff;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Scan animation */
      @keyframes scan {
        0% { top: 0%; opacity: 0.8; }
        50% { top: 100%; opacity: 0.8; }
        100% { top: 0%; opacity: 0.8; }
      }
      .animate-scan {
        animation: scan 3s infinite linear;
      }

      /* Breathing animation */
      @keyframes breathe {
        0% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 20px rgba(0, 209, 255, 0.2); }
        45% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 50px rgba(0, 209, 255, 0.6); }
        55% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 50px rgba(0, 209, 255, 0.6); }
        100% { transform: scale(0.92); opacity: 0.6; box-shadow: 0 0 20px rgba(0, 209, 255, 0.2); }
      }
      .animate-breathe {
        animation: breathe 16s infinite ease-in-out;
      }

      /* Subtle grid noise background */
      .bg-bio-grid {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "remark-gfm": "https://aistudiocdn.com/remark-gfm@^4.0.1"
  }
}
</script>
</head>
  <body class="bg-space-obsidian bg-bio-grid min-h-screen">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

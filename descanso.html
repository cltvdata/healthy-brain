<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Descanso</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/design-system.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-image:
                radial-gradient(circle at 50% 10%, rgba(255, 138, 0, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .timer-text {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body class="bg-dark text-white min-h-screen">
    <div
        class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden pb-24 shadow-2xl border-x border-white/5">

        <!-- Header -->
        <header class="flex items-center justify-between p-6 pb-4 border-b border-white/5 bg-dark/80 backdrop-blur-xl sticky top-0 z-40">
            <div>
                <h1 class="text-2xl font-black tracking-tighter uppercase italic">Bio-<span
                        class="text-primary">Recuperación</span></h1>
                <p class="text-[10px] font-black text-text-gray uppercase tracking-widest mt-1">Sincronización Cerebral</p>
            </div>
            <a href="perfil-setup.html"
                class="h-10 w-10 overflow-hidden rounded-xl border border-white/10 bg-surface-glass backdrop-blur-md flex items-center justify-center hover:border-primary transition-all shadow-lg shrink-0">
                <span class="material-symbols-outlined text-text-gray text-[20px]">person</span>
            </a>
        </header>

        <main class="flex-1 px-6 py-8 flex flex-col items-center justify-center no-scrollbar">

            <!-- Circular Progress & Timer -->
            <div class="relative w-72 h-72 mb-12 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90 absolute top-0 left-0" viewBox="0 0 100 100">
                    <!-- Base ring -->
                    <circle cx="50" cy="50" r="45" fill="none" class="stroke-white/5" stroke-width="4"></circle>
                    <!-- Progress ring -->
                    <circle id="progress-ring" cx="50" cy="50" r="45" fill="none" class="stroke-primary"
                        stroke-width="5" stroke-dasharray="283" stroke-dashoffset="0" stroke-linecap="round"
                        style="transition: stroke-dashoffset 1s linear;"></circle>
                </svg>
                <div class="flex flex-col items-center justify-center relative z-10 text-center">
                    <span id="timer-display"
                        class="timer-text text-7xl font-black text-white tracking-tighter italic">01:00</span>
                    <div id="timer-status-container" class="mt-2">
                        <span id="timer-status"
                            class="text-[10px] font-black text-primary uppercase tracking-[0.3em] bg-primary/10 px-3 py-1 rounded-full border border-primary/20">Listo</span>
                    </div>
                </div>
                <!-- Background Glow -->
                <div class="absolute inset-0 bg-primary/5 blur-[80px] rounded-full pointer-events-none"></div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-8 mb-12">
                <!-- Add 30s -->
                <button onclick="addTime(30)"
                    class="w-14 h-14 rounded-2xl bg-white/2 border border-white/10 text-white font-black flex items-center justify-center hover:bg-white/5 transition-all text-[10px] uppercase tracking-tighter">
                    +30s
                </button>

                <!-- Play / Pause -->
                <button id="play-btn" onclick="toggleTimer()"
                    class="glow-btn w-24 h-24 rounded-[32px] bg-primary text-dark flex items-center justify-center shadow-[0_0_30px_rgba(255,138,0,0.3)] hover:scale-105 active:scale-95 transition-all">
                    <span id="play-icon" class="material-symbols-outlined text-[48px] font-black">play_arrow</span>
                </button>

                <!-- Add 1m -->
                <button onclick="addTime(60)"
                    class="w-14 h-14 rounded-2xl bg-white/2 border border-white/10 text-white font-black flex items-center justify-center hover:bg-white/5 transition-all text-[10px] uppercase tracking-tighter">
                    +1m
                </button>
            </div>

            <!-- Presets Grid -->
            <div class="w-full">
                <div class="flex items-center justify-between mb-4 px-1">
                    <h3 class="text-[10px] font-black text-text-gray uppercase tracking-widest">Protocolos de Tiempo
                    </h3>
                    <button onclick="resetTimer()"
                        class="text-[10px] text-red-500 font-black uppercase tracking-widest hover:text-red-400 transition-colors flex items-center gap-1.5 bg-red-500/10 px-3 py-1.5 rounded-lg border border-red-500/10">
                        <span class="material-symbols-outlined text-[14px] font-black">history</span> Reiniciar
                    </button>
                </div>

                <div class="grid grid-cols-5 gap-3">
                    <button onclick="setTimer(30)"
                        class="py-4 rounded-xl glass-card border-white/5 text-white/50 font-black text-[10px] hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all uppercase tracking-tighter">30s</button>
                    <button onclick="setTimer(60)"
                        class="py-4 rounded-xl glass-card border-white/5 text-white/50 font-black text-[10px] hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all uppercase tracking-tighter">60s</button>
                    <button onclick="setTimer(90)"
                        class="py-4 rounded-xl glass-card border-white/5 text-white/50 font-black text-[10px] hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all uppercase tracking-tighter">90s</button>
                    <button onclick="setTimer(120)"
                        class="py-4 rounded-xl glass-card border-white/5 text-white/50 font-black text-[10px] hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all uppercase tracking-tighter">2m</button>
                    <button onclick="setTimer(180)"
                        class="py-4 rounded-xl glass-card border-white/5 text-white/50 font-black text-[10px] hover:bg-primary/20 hover:text-primary hover:border-primary/50 transition-all uppercase tracking-tighter">3m</button>
                </div>
            </div>

            <!-- Custom Time & Breathing -->
            <div class="w-full flex gap-4 mt-6">
                <button onclick="setCustomTime()"
                    class="flex-1 py-4 rounded-2xl bg-white/2 text-text-gray font-black text-[10px] flex items-center justify-center gap-2 hover:bg-white/5 transition-all border border-dashed border-white/10 uppercase tracking-widest">
                    <span class="material-symbols-outlined text-[16px] font-black">edit</span> Ajuste Manual
                </button>
                <button onclick="openBreathMode()"
                    class="flex-1 py-4 rounded-2xl bg-neon/10 text-neon font-black text-[10px] flex items-center justify-center gap-2 hover:bg-neon/20 transition-all border border-neon/20 uppercase tracking-widest shadow-[0_0_15px_rgba(0,209,255,0.1)]">
                    <span class="material-symbols-outlined text-[16px] font-black">lungs</span> Coherencia
                </button>
            </div>

        </main>

        <!-- Fixed Bottom Nav -->
        <nav
            class="fixed bottom-0 left-0 w-full border-t border-white/5 bg-dark/90 backdrop-blur-2xl pb-safe pt-4 z-50">
            <div class="flex items-center justify-around max-w-md mx-auto px-4 pb-4">
                <a href="index.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">home</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Lobby</span>
                </a>
                <a href="entrenar.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">fitness_center</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Gimnasio</span>
                </a>
                <a href="historial.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">analytics</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Progreso</span>
                </a>
                <a href="descanso.html" class="flex flex-col items-center gap-1 text-primary w-1/5">
                    <span class="material-symbols-outlined filled"
                        style="font-variation-settings: 'FILL' 1;">timer</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Descanso</span>
                </a>
                <a href="ejercicios.html"
                    class="flex flex-col items-center gap-1 text-text-gray hover:text-white transition-all w-1/5">
                    <span class="material-symbols-outlined">library_books</span>
                    <span class="text-[10px] font-bold uppercase tracking-tighter">Biblioteca</span>
                </a>
            </div>
        </nav>
    </div>

    <!-- Breathing Mode Overlay -->
    <div id="breath-overlay"
        class="fixed inset-0 bg-dark z-[60] hidden flex-col items-center justify-center p-10 animate-fade-in">
        <button onclick="closeBreathMode()"
            class="absolute top-8 right-8 text-text-gray hover:text-white transition-all"><span
                class="material-symbols-outlined text-[32px] font-black">close</span></button>

        <div id="breath-circle"
            class="w-56 h-56 rounded-full bg-neon/10 border-2 border-neon/30 flex items-center justify-center relative shadow-[0_0_60px_rgba(0,209,255,0.2)] transition-all ease-in-out">
            <span id="breath-label" class="text-xl font-black text-neon uppercase tracking-[0.3em] italic">Inhala</span>
            <!-- Inner Glow -->
            <div class="absolute inset-2 rounded-full border border-neon/10"></div>
        </div>

        <div class="mt-20 text-center">
            <h2 class="text-3xl font-black mb-3 uppercase tracking-tighter italic">Coherencia Cardíaca</h2>
            <p class="text-text-gray text-xs max-w-xs leading-relaxed uppercase font-bold tracking-tight">Sincroniza tu
                ritmo para reducir el cortisol y maximizar la recuperación.</p>
            <div id="breath-seconds" class="mt-6 text-5xl font-black text-white/40 tracking-tighter tabular-nums">4.0
            </div>
        </div>

        <div class="absolute -bottom-20 -right-20 w-80 h-80 bg-neon/5 blur-[100px] pointer-events-none"></div>
    </div>

    <!-- Application Logic -->
    <script>
        let initialTime = 60;
        let timeRemaining = 60;
        let timerInterval = null;
        let isRunning = false;

        const timerDisplay = document.getElementById('timer-display');
        const timerStatus = document.getElementById('timer-status');
        const playIcon = document.getElementById('play-icon');
        const playBtn = document.getElementById('play-btn');
        const progressRing = document.getElementById('progress-ring');
        const circumference = 2 * Math.PI * 45;

        function updateDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const proportion = timeRemaining / initialTime;
            const offset = circumference - (proportion * circumference);
            progressRing.style.strokeDashoffset = offset || 0;

            if (timeRemaining === 0) {
                progressRing.style.stroke = "#ef4444";
                timerDisplay.classList.add('text-red-500');
            } else {
                progressRing.style.stroke = "#ff8a00";
                timerDisplay.classList.remove('text-red-500');
            }
        }

        function setTimer(seconds) {
            initialTime = seconds;
            timeRemaining = seconds;
            localStorage.setItem('hb_last_rest', seconds);
            if (isRunning) {
                pauseTimer();
            }
            updateDisplay();
            timerStatus.textContent = "Listo";
            timerStatus.style.opacity = "1";
        }

        function toggleTimer() {
            if (timeRemaining === 0) {
                resetTimer();
                return;
            }

            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timeRemaining > 0) {
                isRunning = true;
                playIcon.textContent = 'pause';
                playBtn.classList.remove('bg-primary');
                playBtn.classList.add('bg-white');
                timerStatus.textContent = "Analizando";
                timerStatus.classList.add('animate-pulse-glow');

                timerInterval = setInterval(() => {
                    timeRemaining--;
                    updateDisplay();

                    if (timeRemaining <= 0) {
                        finishTimer();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            playIcon.textContent = 'play_arrow';
            playBtn.classList.remove('bg-white');
            playBtn.classList.add('bg-primary');
            timerStatus.textContent = "Pausado";
            timerStatus.classList.remove('animate-pulse-glow');
        }

        function resetTimer() {
            pauseTimer();
            timeRemaining = initialTime;
            updateDisplay();
            timerStatus.textContent = "Listo";
        }

        function addTime(seconds) {
            timeRemaining += seconds;
            if (timeRemaining > initialTime) {
                initialTime = timeRemaining;
            }
            updateDisplay();
            if (timeRemaining > 0 && playIcon.textContent === 'restart_alt') {
                playIcon.textContent = 'play_arrow';
                playBtn.classList.remove('bg-red-500');
                playBtn.classList.add('bg-primary');
            }
        }

        function finishTimer() {
            pauseTimer();
            timerStatus.textContent = "¡Tiempo!";
            playIcon.textContent = 'restart_alt';
            playBtn.classList.remove('bg-white', 'bg-primary');
            playBtn.classList.add('bg-red-500');

            if ("vibrate" in navigator) {
                navigator.vibrate([200, 100, 200, 100, 500]);
            }
        }

        function setCustomTime() {
            const input = prompt("Introduce los minutos para el descanso (ej. 1.5):", "1");
            if (input !== null) {
                const num = parseFloat(input);
                if (!isNaN(num) && num > 0) {
                    setTimer(Math.round(num * 60));
                }
            }
        }

        let breathInterval = null;
        let breathTimer = null;

        function openBreathMode() {
            document.getElementById('breath-overlay').classList.remove('hidden');
            document.getElementById('breath-overlay').classList.add('flex');
            startBreathCycle();
        }

        function closeBreathMode() {
            document.getElementById('breath-overlay').classList.add('hidden');
            document.getElementById('breath-overlay').classList.remove('flex');
            clearInterval(breathInterval);
            clearTimeout(breathTimer);
            const circle = document.getElementById('breath-circle');
            circle.style.transform = 'scale(1)';
        }

        function startBreathCycle() {
            const circle = document.getElementById('breath-circle');
            const label = document.getElementById('breath-label');
            const secondsText = document.getElementById('breath-seconds');

            let phase = 0;
            const phases = [
                { name: 'Inhala', time: 4, scale: 1.4, duration: 4000 },
                { name: 'Retén', time: 1.5, scale: 1.4, duration: 1500 },
                { name: 'Exhala', time: 8, scale: 1, duration: 8000 },
                { name: 'Retén', time: 1.5, scale: 1, duration: 1500 }
            ];

            function nextPhase() {
                const p = phases[phase];
                label.innerText = p.name;
                circle.style.transitionDuration = `${p.duration}ms`;
                circle.style.transform = `scale(${p.scale})`;

                let remaining = p.time;

                if (breathInterval) clearInterval(breathInterval);
                breathInterval = setInterval(() => {
                    remaining -= 0.1;
                    secondsText.innerText = Math.max(0, remaining).toFixed(1);
                    if (remaining <= 0) {
                        clearInterval(breathInterval);
                    }
                }, 100);

                if (breathTimer) clearTimeout(breathTimer);
                breathTimer = setTimeout(() => {
                    phase = (phase + 1) % phases.length;
                    nextPhase();
                }, p.duration);
            }

            nextPhase();
        }

        function applyUserBg() {
            const bg = localStorage.getItem('hb_user_bg') || 'tech';
            const bgOverlay = document.createElement('div');
            bgOverlay.id = 'dynamic-bg';
            bgOverlay.className = 'fixed inset-0 pointer-events-none z-[-1] opacity-[0.08] transition-opacity duration-1000';
            bgOverlay.style.backgroundImage = `url('assets/images/bg_${bg}.png')`;
            bgOverlay.style.backgroundSize = 'cover';
            bgOverlay.style.backgroundPosition = 'center';
            document.body.appendChild(bgOverlay);
        }

        applyUserBg();
        updateDisplay();
    </script>
</body>

</html>

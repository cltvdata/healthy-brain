<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HEALTHY + BRAIN - Bio-Sync AI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/design-system.css">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0a0a0a;
            -webkit-tap-highlight-color: transparent;
            background-image:
                radial-gradient(circle at 50% 10%, rgba(0, 209, 255, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="text-white min-h-screen">
    <div class="relative w-full max-w-md mx-auto min-h-screen flex flex-col overflow-x-hidden bg-dark border-x border-white/5 shadow-2xl">
        <header class="flex items-center gap-4 p-6 pb-4 bg-dark/80 backdrop-blur-xl sticky top-0 z-40">
            <a href="index.html" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white hover:bg-white/10 transition-all shrink-0">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
            </a>
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase italic leading-tight">Bio-<span class="text-neon">Sync AI</span></h1>
                <p class="text-[10px] font-black text-text-gray uppercase tracking-widest mt-0.5">Importa tus Datos</p>
            </div>
        </header>

        <main class="flex-1 px-6 pb-24 overflow-y-auto no-scrollbar">
            <section class="py-6">
                <div class="glass-card p-6 border-white/5 mb-6">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="w-12 h-12 rounded-2xl bg-neon/10 flex items-center justify-center">
                            <span class="material-symbols-outlined text-neon text-2xl">sync</span>
                        </div>
                        <div>
                            <h2 class="font-bold text-lg">Sincronización Universal</h2>
                            <p class="text-[10px] text-text-gray">Conecta tus apps de salud</p>
                        </div>
                    </div>
                </div>

                <h3 class="text-[11px] font-black text-white/40 uppercase tracking-[0.2em] mb-4">Apps Soportadas</h3>
                
                <div class="space-y-3">
                    <button onclick="connectApp('apple')" class="w-full glass-card p-4 flex items-center justify-between border-white/5 hover:border-neon/30 transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">
                                <span class="material-symbols-outlined text-white">apple</span>
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-sm">Apple Health</p>
                                <p class="text-[9px] text-text-gray">FC, Pasos, Sueño</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-text-gray group-hover:text-neon">chevron_right</span>
                    </button>

                    <button onclick="connectApp('google')" class="w-full glass-card p-4 flex items-center justify-between border-white/5 hover:border-neon/30 transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">
                                <span class="material-symbols-outlined text-white">fitbit</span>
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-sm">Google Fit</p>
                                <p class="text-[9px] text-text-gray">Actividad, Calorías</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-text-gray group-hover:text-neon">chevron_right</span>
                    </button>

                    <button onclick="connectApp('whoop')" class="w-full glass-card p-4 flex items-center justify-between border-white/5 hover:border-neon/30 transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">
                                <span class="material-symbols-outlined text-white">monitor_heart</span>
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-sm">Whoop</p>
                                <p class="text-[9px] text-text-gray">HRV, Recovery</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-text-gray group-hover:text-neon">chevron_right</span>
                    </button>

                    <button onclick="connectApp('ouraring')" class="w-full glass-card p-4 flex items-center justify-between border-white/5 hover:border-neon/30 transition-all group">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">
                                <span class="material-symbols-outlined text-white">bedtime</span>
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-sm">Oura Ring</p>
                                <p class="text-[9px] text-text-gray">Sueño, Readiness</p>
                            </div>
                        </div>
                        <span class="material-symbols-outlined text-text-gray group-hover:text-neon">chevron_right</span>
                    </button>
                </div>

                <div class="mt-10">
                    <h3 class="text-[11px] font-black text-white/40 uppercase tracking-[0.2em] mb-4">Importar Archivo</h3>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="importCSV()" class="glass-card p-4 flex flex-col items-center gap-2 border-white/5 hover:border-primary/30 transition-all">
                            <span class="material-symbols-outlined text-primary text-2xl">upload_file</span>
                            <span class="text-[10px] font-bold uppercase">CSV</span>
                        </button>
                        
                        <button onclick="importManual()" class="glass-card p-4 flex flex-col items-center gap-2 border-white/5 hover:border-neon/30 transition-all">
                            <span class="material-symbols-outlined text-neon text-2xl">edit_note</span>
                            <span class="text-[10px] font-bold uppercase">Manual</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function connectApp(app) {
            alert('📲 Conectando con ' + app.toUpperCase() + '...\n\nEsta función se integrará con la API de ' + app + ' en la próxima actualización.');
        }
        
        function importCSV() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    alert('📄 Archivo seleccionado: ' + file.name + '\n\nProcesando datos...');
                }
            };
            input.click();
        }
        
        function importManual() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

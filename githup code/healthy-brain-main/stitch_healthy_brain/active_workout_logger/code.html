<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Active Workout Logger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ed9a26",
                        "background-light": "#f8f7f6",
                        "background-dark": "#221a10",
                        "concrete": "#4a4a48",
                        "olive-text": "#acc0a4"
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden pb-24">
<!-- Header with Imagery -->
<div class="relative h-64 w-full">
<div class="absolute inset-0 bg-gradient-to-t from-background-dark via-background-dark/40 to-transparent z-10"></div>
<div class="absolute inset-0 bg-cover bg-center" data-alt="Dark moody gym interior with weights" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD7p-SC7WsVJVZwM91VgAnpesUCji8ruRAyb5tx91syxo-Bq3Y18VAtyAC39zSLySQsSsx__9ZSBWe2B2PTjxstJMKHoImkBXFccBjJd4ttzWKIg5Nt4E-CYnU2Y75CzZdQa8sgLnn4u6AyA4raDN7IXzuDw8vkGmxm1FQLZGbDneLqjrW9gLonikv5hj9UD9-JfzgVcPaIbonInJhfamjOgoH80SoOLRe54GIvFCqkra7wgR4nzslhiVIfzrMScYTgYI8U-TabQ1o')"></div>
<div class="relative z-20 flex flex-col h-full justify-between p-6">
<div class="flex items-center justify-between">
<button class="p-2 rounded-full bg-background-dark/50 backdrop-blur-md">
<span class="material-symbols-outlined text-white">close</span>
</button>
<div class="flex items-center gap-2 bg-primary/20 backdrop-blur-md px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-primary text-sm">timer</span>
<span class="text-primary font-bold text-sm">42:15</span>
</div>
</div>
<div>
<h1 class="text-3xl font-bold text-white tracking-tight">Leg Day</h1>
<p class="text-slate-300 text-sm mt-1">Metabolic Health • High Intensity</p>
</div>
</div>
</div>
<!-- Action Bar -->
<div class="flex px-4 py-6 justify-between items-center">
<button class="flex items-center gap-2 px-6 py-3 bg-concrete rounded-xl text-olive-text font-bold shadow-lg">
<span class="material-symbols-outlined">add_circle</span>
<span>Add Exercise</span>
</button>
<div class="flex gap-4">
<button class="text-slate-400">
<span class="material-symbols-outlined">history</span>
</button>
<button class="text-slate-400">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Exercise Card: Squats -->
<div class="px-4 mb-6">
<div class="bg-background-dark/50 border border-slate-800 rounded-xl overflow-hidden">
<div class="p-4 flex justify-between items-center border-b border-slate-800">
<h3 class="text-xl font-bold text-white">Squats (Barbell)</h3>
<span class="material-symbols-outlined text-slate-500">more_horiz</span>
</div>
<div class="p-4">
<!-- Table Header -->
<div class="grid grid-cols-5 gap-2 mb-3 px-2 text-[10px] uppercase tracking-widest font-bold text-slate-500">
<div class="text-center">Set</div>
<div class="col-span-1 text-center">Previous</div>
<div class="text-center">kg</div>
<div class="text-center">Reps</div>
<div class="text-right"></div>
</div>
<!-- Set 1 (Completed) -->
<div class="grid grid-cols-5 gap-2 mb-2 items-center bg-slate-800/30 p-2 rounded-lg">
<div class="text-center font-bold text-slate-400">1</div>
<div class="text-center text-xs text-slate-500">80 x 10</div>
<div class="bg-background-dark border border-slate-700 rounded py-1 text-center font-medium">100</div>
<div class="bg-background-dark border border-slate-700 rounded py-1 text-center font-medium">8</div>
<div class="flex justify-end">
<div class="bg-primary text-background-dark size-6 rounded flex items-center justify-center">
<span class="material-symbols-outlined text-lg font-bold">check</span>
</div>
</div>
</div>
<!-- Set 2 (Active) -->
<div class="grid grid-cols-5 gap-2 mb-2 items-center bg-primary/10 p-2 rounded-lg">
<div class="text-center font-bold text-primary">2</div>
<div class="text-center text-xs text-slate-500">80 x 10</div>
<input class="bg-background-dark border border-primary/50 rounded py-1 text-center font-medium text-white focus:ring-1 focus:ring-primary focus:border-primary outline-none" type="number" value="100"/>
<input class="bg-background-dark border border-slate-700 rounded py-1 text-center font-medium text-white focus:ring-1 focus:ring-primary focus:border-primary outline-none" placeholder="8" type="number"/>
<div class="flex justify-end">
<button class="bg-slate-700 text-slate-300 size-6 rounded flex items-center justify-center hover:bg-primary hover:text-background-dark transition-colors">
<span class="material-symbols-outlined text-lg font-bold">check</span>
</button>
</div>
</div>
<!-- Add Set Button -->
<button class="w-full py-2 mt-2 border border-dashed border-slate-700 rounded-lg text-slate-500 text-sm font-medium hover:bg-slate-800/50">
                        + Add Set
                    </button>
</div>
</div>
</div>
<!-- Exercise Card: Leg Press -->
<div class="px-4 mb-6 opacity-80">
<div class="bg-background-dark/50 border border-slate-800 rounded-xl overflow-hidden">
<div class="p-4 flex justify-between items-center border-b border-slate-800">
<h3 class="text-xl font-bold text-white">Leg Press</h3>
<span class="material-symbols-outlined text-slate-500">more_horiz</span>
</div>
<div class="p-4 text-center">
<button class="text-primary text-sm font-bold flex items-center justify-center gap-1 w-full py-2">
<span class="material-symbols-outlined text-sm">add</span> Start Set
                    </button>
</div>
</div>
</div>
<!-- Bottom Navigation & Action -->
<div class="fixed bottom-0 left-0 right-0 z-50">
<div class="px-4 pb-4">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-2xl flex items-center justify-center gap-2 transition-all active:scale-95">
<span class="material-symbols-outlined">done_all</span>
                    Finish Workout
                </button>
</div>
<div class="bg-background-dark/95 backdrop-blur-lg border-t border-slate-800 flex justify-around items-center px-4 py-3">
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-1">fitness_center</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Train</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">monitoring</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Progress</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-[10px] font-medium uppercase tracking-tighter">Profile</span>
</a>
</div>
</div>
</div>
</body></html>
